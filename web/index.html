<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>psdtext</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header id="topbar">
	<div class="brand">psdtext</div>
	<button id="openBtn" data-i18n="app.open" data-i18n-title="app.open.title">Open…</button>
	<span id="docPath" class="path" title=""></span>
	<span id="dirtyBadge" class="badge" hidden></span>
	<span class="spacer"></span>
	<input type="search" id="filter" data-i18n-ph="app.filter.ph">
	<button id="sheetBtn" data-i18n="app.sheet" data-i18n-title="app.sheet.title">Edit as a list</button>
	<button id="exportBtn" data-i18n="app.csvExport" data-i18n-title="app.csvExport.title">Export CSV</button>
	<button id="importBtn" data-i18n="app.csvImport" data-i18n-title="app.csvImport.title">Import CSV</button>
	<button id="saveBtn" class="primary" data-i18n="app.save" data-i18n-title="app.save.title">Save</button>
	<select id="langSel" class="lang" data-i18n-title="app.lang.title">
		<option value="en">EN</option>
		<option value="ja">日本語</option>
	</select>
	<button id="helpBtn" class="icon" data-i18n-title="app.help.title">?</button>
	<button id="logBtn" class="icon" data-i18n-title="app.log.title">≡</button>
</header>

<main id="layout">
	<!-- 左: レイヤツリー -->
	<nav id="treePane" class="pane">
		<div class="pane-title">
			<span data-i18n="tree.title">Layers</span>
			<span class="title-actions">
				<button id="showAllBtn" class="mini" data-i18n="tree.showAll" data-i18n-title="tree.showAll.title">Show all</button>
				<button id="textOnlyBtn" class="mini" data-i18n="tree.textOnly" data-i18n-title="tree.textOnly.title">Text only</button>
				<button id="resetVisBtn" class="mini" data-i18n="tree.reset" data-i18n-title="tree.reset.title">Reset</button>
			</span>
		</div>
		<!-- 一覧に出すものの絞り込み (上の目玉アイコン = プレビューの表示 ON/OFF とは別) -->
		<div id="listFilter">
			<span class="lf-label" data-i18n="tree.filter">List</span>
			<button class="mini flt" data-flt="text" data-i18n="tree.flt.text" data-i18n-title="tree.flt.text.title">Text</button>
			<button class="mini flt" data-flt="dirty" data-i18n="tree.flt.dirty" data-i18n-title="tree.flt.dirty.title">Unsaved</button>
			<button class="mini flt" data-flt="visible" data-i18n="tree.flt.visible" data-i18n-title="tree.flt.visible.title">Shown</button>
		</div>
		<div id="tree"></div>
		<div class="pane-foot">
			<button id="moveUpBtn" class="icon" disabled data-i18n-title="tree.up.title">▲</button>
			<button id="moveDownBtn" class="icon" disabled data-i18n-title="tree.down.title">▼</button>
			<button id="renameBtn" disabled data-i18n="tree.rename" data-i18n-title="tree.rename.title">Rename</button>
			<button id="dupBtn" disabled data-i18n="tree.dup" data-i18n-title="tree.dup.title">Duplicate</button>
		</div>
	</nav>

	<!-- 中央: 合成プレビュー -->
	<section id="viewPane">
		<div class="view-bar">
			<button id="zoomOut" class="icon" data-i18n-title="view.zoomOut.title">−</button>
			<button id="zoomLevel" data-i18n-title="view.zoom.title">100%</button>
			<button id="zoomIn" class="icon" data-i18n-title="view.zoomIn.title">＋</button>
			<button id="zoomFit" data-i18n="view.fit" data-i18n-title="view.fit.title">Fit</button>
			<span class="spacer"></span>
			<label class="chk" data-i18n-title="view.renderText.title">
				<input type="checkbox" id="renderText" checked>
				<span data-i18n="view.renderText">Redraw text</span>
			</label>
			<label class="chk" data-i18n-title="view.bounds.title">
				<input type="checkbox" id="showBounds" checked>
				<span data-i18n="view.bounds">Bounds</span>
			</label>
			<span id="viewStatus" class="status"></span>
		</div>
		<div id="canvasWrap">
			<canvas id="stage"></canvas>
		</div>
		<div id="viewNote">
			<span class="note-icon">⚠</span>
			<span id="viewNoteText"></span>
			<button id="viewNoteMore" class="linkish" data-i18n="view.more">Details</button>
		</div>
	</section>

	<!-- 右: 編集 -->
	<aside id="editPane" class="pane">
		<div class="pane-title" data-i18n="edit.title">Edit</div>

		<!-- 複数選択しているときの一括操作 (言語違いをまとめて扱うため) -->
		<div id="multiPane" hidden>
			<div class="fmt-title"><span id="multiCount"></span></div>
			<div id="multiList" class="multi-list"></div>

			<div class="fmt-title" data-i18n="multi.styleTitle">Initial formatting for all of them</div>
			<div class="style-bar">
				<button id="mFontBtn" class="mini" data-i18n="multi.font">Font…</button>
				<label><span data-i18n="edit.size">Size</span>
					<input type="number" id="mSize" class="num" min="1" max="2000" step="0.5">
				</label>
				<button id="mSizeGo" class="mini" data-i18n="multi.apply">Apply</button>
				<label><span data-i18n="edit.color">Color</span>
					<input type="color" id="mColor" class="swatch">
				</label>
				<button id="mColorGo" class="mini" data-i18n="multi.apply">Apply</button>
			</div>
			<div class="style-bar">
				<span class="style-group">
					<button class="mini" id="mBold" data-i18n-title="edit.bold"><b>B</b></button>
					<button class="mini" id="mItalic" data-i18n-title="edit.italic"><i>I</i></button>
					<button class="mini" id="mUnder" data-i18n-title="edit.under"><u>U</u></button>
				</span>
				<span class="align-group">
					<button class="mini malign" data-align="0" data-i18n-title="edit.alignL">⯇</button>
					<button class="mini malign" data-align="2" data-i18n-title="edit.alignC">⯈⯇</button>
					<button class="mini malign" data-align="1" data-i18n-title="edit.alignR">⯈</button>
				</span>
				<span class="spacer"></span>
				<button id="mCopyStyle" class="mini" data-i18n="multi.copyStyle" data-i18n-title="multi.copyStyle.title">Copy formatting</button>
				<button id="mPasteStyle" class="mini" disabled data-i18n="multi.pasteStyle" data-i18n-title="multi.pasteStyle.title">Paste</button>
			</div>
			<p class="hint" data-i18n="multi.hint"></p>

			<div class="style-bar">
				<button id="mDup" data-i18n="multi.dup" data-i18n-title="multi.dup.title">Duplicate…</button>
				<button id="mExport" data-i18n="multi.export" data-i18n-title="multi.export.title">Export these to CSV</button>
			</div>
			<div id="multiStatus" class="status"></div>
		</div>

		<div id="editMeta" class="meta"></div>

		<!-- 位置と流し込み枠。上の「位置」表示のすぐ下に置いて、元の値と
		     見比べながら数値を入れられるようにする。 -->
		<div id="placeBar" class="style-bar">
			<label><span data-i18n="edit.pos">Position</span>
				<input type="number" id="posX" class="num" step="1" disabled data-i18n-title="edit.posX.title">
				<input type="number" id="posY" class="num" step="1" disabled data-i18n-title="edit.posY.title">
			</label>
			<label><span data-i18n="edit.box">Box</span>
				<input type="number" id="boxW" class="num" step="1" min="1" disabled data-i18n-title="edit.boxW.title">
				<input type="number" id="boxH" class="num" step="1" min="1" disabled data-i18n-title="edit.boxH.title">
			</label>
			<span id="placeHint" class="status"></span>
		</div>

		<!-- カーソルが基準のところ (手前に書式マークが無い) にいるとき:
		     レイヤ全体の初期書式 -->
		<div id="basePanel" class="fmt-panel">
			<div class="fmt-title" data-i18n="fmt.baseTitle">Initial formatting</div>
			<div class="style-bar">
				<label><span data-i18n="edit.font">Font</span>
					<select id="fontSel" disabled></select>
				</label>
				<button id="fontAddBtn" class="mini" disabled data-i18n-title="edit.font.add">＋</button>
				<label><span data-i18n="edit.size">Size</span>
					<input type="number" id="sizeInput" class="num" min="1" max="2000" step="0.5" disabled>
				</label>
				<label><span data-i18n="edit.color">Color</span>
					<input type="color" id="colorInput" class="swatch" disabled data-i18n-title="edit.color.title">
					<input type="text" id="colorHex" class="hex" spellcheck="false" disabled>
				</label>
				<span class="style-group">
					<button class="mini" id="boldBtn" disabled data-i18n-title="edit.bold"><b>B</b></button>
					<button class="mini" id="italicBtn" disabled data-i18n-title="edit.italic"><i>I</i></button>
					<button class="mini" id="underBtn" disabled data-i18n-title="edit.under"><u>U</u></button>
				</span>
				<span class="align-group">
					<button class="mini align" data-align="0" disabled data-i18n-title="edit.alignL">⯇</button>
					<button class="mini align" data-align="2" disabled data-i18n-title="edit.alignC">⯈⯇</button>
					<button class="mini align" data-align="1" disabled data-i18n-title="edit.alignR">⯈</button>
				</span>
			</div>
		</div>

		<!-- 書式マーク / 選択範囲のとき (中身は app.js が組み立てる) -->
		<div id="markPanel" class="fmt-panel" hidden>
			<div class="fmt-title">
				<span id="markPanelTitle"></span>
				<button id="markDelBtn" class="mini" data-i18n="fmt.remove" data-i18n-title="fmt.remove.title">Remove</button>
			</div>
			<div id="markPanelBody" class="fmt-rows"></div>
		</div>
		<p class="hint" id="styleHint"></p>

		<!-- 本文。タグは出さず、書式の変わり目に ◆ の札が入る。 -->
		<div class="body-head">
			<span data-i18n="edit.body">Body</span>
			<button id="markAddBtn" class="mini" disabled data-i18n="fmt.insert" data-i18n-title="fmt.insert.title">＋Mark</button>
		</div>
		<div id="editText" class="body-edit" spellcheck="false"></div>
		<div class="edit-actions">
			<button id="applyBtn" disabled data-i18n="edit.apply" data-i18n-title="edit.apply.title">Apply</button>
			<button id="revertBtn" disabled data-i18n="edit.revert" data-i18n-title="edit.revert.title">Revert</button>
			<span id="editStatus" class="status"></span>
		</div>
	</aside>
</main>

<!-- PSD を開く -->
<div id="openDialog" class="modal" hidden>
	<div class="modal-box">
		<div class="modal-head"><span data-i18n="dlg.openPsd">Open a PSD</span><button class="icon close" data-close>×</button></div>
		<div class="modal-body">
			<div class="row">
				<input type="text" id="openPath" spellcheck="false" data-i18n-ph="dlg.openPath.ph">
				<button id="openGo" class="primary" data-i18n="dlg.openGo">Open</button>
			</div>
			<div class="browser">
				<div class="crumbs" id="fsCrumbs"></div>
				<div id="fsList" class="fs-list"></div>
			</div>
		</div>
	</div>
</div>

<!-- レイヤの複製 -->
<div id="dupDialog" class="modal" hidden>
	<div class="modal-box narrow">
		<div class="modal-head"><span data-i18n="dlg.dupTitle">Duplicate a text layer</span><button class="icon close" data-close>×</button></div>
		<div class="modal-body">
			<p class="hint" data-i18n="dlg.dupHint"></p>

			<!-- 1 枚だけのとき -->
			<div id="dupOne">
				<div class="row">
					<label style="flex:none" data-i18n="dlg.name">Name</label>
					<input type="text" id="dupName" spellcheck="false">
				</div>
				<label class="block-label" data-i18n="dlg.body">Body</label>
				<textarea id="dupText" spellcheck="false" rows="5"></textarea>
			</div>

			<!-- 複数選択しているとき: 名前の付け方だけ決める -->
			<div id="dupMany" hidden>
				<p id="dupCount" class="summary"></p>
				<div class="row">
					<label style="flex:none" data-i18n="dlg.dupPrefix">Prefix</label>
					<input type="text" id="dupPrefix" spellcheck="false" placeholder="en_">
					<label style="flex:none" data-i18n="dlg.dupSuffix">Suffix</label>
					<input type="text" id="dupSuffix" spellcheck="false">
				</div>
				<p class="hint" data-i18n="dlg.dupManyHint"></p>
			</div>

			<div class="row" style="margin-top:10px; justify-content:flex-end">
				<button id="dupClear" data-i18n="dlg.dupClear">Clear the body</button>
				<button id="dupGo" class="primary" data-i18n="dlg.dupGo">Duplicate</button>
			</div>
		</div>
	</div>
</div>

<!-- フォント追加 -->
<div id="fontDialog" class="modal" hidden>
	<div class="modal-box narrow">
		<div class="modal-head"><span data-i18n="dlg.fontTitle">Add a font</span><button class="icon close" data-close>×</button></div>
		<div class="modal-body">
			<p class="hint" data-i18n="dlg.fontHint"></p>
			<div class="row">
				<span id="fontDlgTarget" class="badge-target"></span>
				<input type="search" id="fontFilter" data-i18n-ph="dlg.fontFilter.ph">
			</div>
			<div class="row">
				<label style="flex:none" data-i18n="dlg.fontPresetLabel">Preset</label>
				<select id="fontPresetSel"></select>
				<button id="fontPresetNew" class="mini" data-i18n="dlg.fontPresetNew" data-i18n-title="dlg.fontPresetNew.title">＋</button>
				<span class="hint" style="margin:0" data-i18n="dlg.fontPresetHint"></span>
			</div>
			<div id="sysFontList" class="fs-list"></div>
			<div class="row" style="margin-top:10px">
				<input type="text" id="fontManual" data-i18n-ph="dlg.fontManual.ph">
				<button id="fontAddGo" class="primary" data-i18n="dlg.fontAdd">Add</button>
			</div>
		</div>
	</div>
</div>

<!-- CSV 書き出し。既定は PSD の隣なので、どこへ出たか探さなくてよい。 -->
<div id="exportDialog" class="modal" hidden>
	<div class="modal-box narrow">
		<div class="modal-head"><span data-i18n="dlg.expTitle">Export a CSV</span><button class="icon close" data-close>×</button></div>
		<div class="modal-body">
			<p class="hint" data-i18n="dlg.expHint"></p>
			<div class="row" id="expSelRow" hidden>
				<label class="chk">
					<input type="checkbox" id="expSelOnly">
					<span id="expSelCount"></span>
				</label>
			</div>
			<div class="row">
				<input type="text" id="expPath" spellcheck="false">
				<button id="expGo" class="primary" data-i18n="dlg.expGo">Export</button>
			</div>
			<div class="row">
				<button id="expDownload" data-i18n="dlg.expDownload">Download instead</button>
				<span id="expStatus" class="status"></span>
			</div>
		</div>
	</div>
</div>

<!-- CSV 読み込み -->
<div id="importDialog" class="modal" hidden>
	<div class="modal-box">
		<div class="modal-head"><span data-i18n="dlg.csvTitle">Import a CSV</span><button class="icon close" data-close>×</button></div>
		<div class="modal-body">
			<p class="hint" data-i18n="dlg.csvHint"></p>
			<div class="row">
				<input type="text" id="impPath" spellcheck="false">
				<button id="impRead" data-i18n="dlg.impRead">Read this file</button>
			</div>
			<div class="row">
				<input type="file" id="csvFile" accept=".csv,text/csv">
				<button id="csvApply" class="primary" disabled data-i18n="dlg.csvApply">Apply</button>
			</div>
			<div id="csvReport" class="report"></div>
		</div>
	</div>
</div>

<!-- 保存 -->
<div id="saveDialog" class="modal" hidden>
	<div class="modal-box narrow">
		<div class="modal-head"><span data-i18n="dlg.saveTitle">Save</span><button class="icon close" data-close>×</button></div>
		<div class="modal-body">
			<div class="row">
				<label class="chk"><input type="checkbox" id="saveBackup" checked> <span data-i18n="dlg.saveBackup">Keep the original as .bak</span></label>
			</div>
			<div class="row">
				<input type="text" id="savePath" spellcheck="false" data-i18n-ph="dlg.savePath.ph">
				<button id="saveGo" class="primary" data-i18n="dlg.saveGo">Save</button>
			</div>
			<p class="hint" data-i18n="dlg.saveHint"></p>
		</div>
	</div>
</div>

<!-- 一覧編集 (複数レイヤを表でまとめて書き換える) -->
<div id="sheetDialog" class="modal" hidden>
	<div class="modal-box wide">
		<div class="modal-head">
			<span data-i18n="sheet.title">Edit as a list</span>
			<button class="icon close" data-close>×</button>
		</div>
		<div class="modal-body">
			<p class="hint" data-i18n="sheet.hint"></p>
			<div class="sheet-wrap">
				<table id="sheetTable" class="sheet"></table>
			</div>
			<div class="row" style="margin-top:10px; align-items:center">
				<button id="sheetApply" class="primary" data-i18n="sheet.apply">Apply changes</button>
				<button id="sheetReload" data-i18n="sheet.reload">Reload</button>
				<span id="sheetStatus" class="status"></span>
			</div>
		</div>
	</div>
</div>

<!-- ヘルプ -->
<div id="helpDialog" class="modal" hidden>
	<div class="modal-box wide">
		<div class="modal-head"><span data-i18n="dlg.helpTitle">How to use psdtext</span><button class="icon close" data-close>×</button></div>
		<div class="modal-body" id="helpBody"></div>
	</div>
</div>

<div id="logPanel" hidden>
	<div class="log-head"><span data-i18n="dlg.logTitle">Log</span><button id="logClose" class="icon">×</button></div>
	<div id="logBody"></div>
</div>

<div id="toast" hidden></div>

<script type="module" src="./app.js"></script>
</body>
</html>
