#---------------------------------------------------------------------------
# CI — ビルドしてスモークテスト (起動して PSD を開き、テキストを書き換えて
#      保存し直せるか) まで通す
#
# 依存 (appserve / psdparse / zlib) は CMake が FetchContent で取ってくるので、
# チェックアウトはこのリポジトリだけでよい。
#
# Windows / Linux とも必須。Linux は POSIX 側のコードパスの見張り役。
#---------------------------------------------------------------------------
name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, experimental: false }
          - { name: linux,   os: ubuntu-latest,  experimental: false }

    steps:
      - uses: actions/checkout@v7

      # 書式マークのタグ組み替えは UI から目視で確かめにくいので単体で押さえる
      - name: Formatting-mark unit test
        run: node tests/tags.test.mjs

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Locate the executable
        id: exe
        shell: bash
        run: |
          for p in build/psdtext build/psdtext.exe \
                   build/Release/psdtext.exe build/Release/psdtext; do
            if [ -f "$p" ]; then echo "path=$p" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "could not find the built executable:" && find build -maxdepth 2 -type f -name 'psdtext*'
          exit 1

      - name: Fetch a PSD with text layers
        shell: bash
        run: |
          # psdparse のテスト資材
          #   textboxsample : テキストレイヤ / 複数フォント / 縦書き入り
          #   textmask      : 上記のテキストレイヤにマスクを付けたもの
          mkdir -p testdata
          curl -sfL -o testdata/textboxsample.psd             https://raw.githubusercontent.com/wamsoft/psdparse/master/tests/data/textboxsample.psd
          curl -sfL -o mask/textmask.psd --create-dirs        https://raw.githubusercontent.com/wamsoft/psdparse/master/tests/data/textmask.psd
          ls -la testdata/ mask/

      - name: Smoke test
        shell: bash
        env:
          # Windows の Python は stdout を cp1252 で書こうとして、日本語や絵文字を
          # print した時点で UnicodeEncodeError になる
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          EXE="${{ steps.exe.outputs.path }}"
          B=http://127.0.0.1:18998
          # Windows の Git Bash では $PWD が /d/a/... という MSYS 形式になり、
          # ネイティブの exe から開けない。pwd -W で D:/a/... へ直す。
          ROOT=$(pwd -W 2>/dev/null || pwd)

          "$EXE" --no-browser --port=18998 --no-token --idle-timeout=0 &
          for i in $(seq 1 40); do
            curl -sf $B/_app/info > /dev/null && break
            sleep 0.25
          done

          echo "--- 埋め込み UI ---"
          curl -sf -o /dev/null -w 'index.html %{http_code}\n' $B/

          echo "--- 文書が無いときの応答 ---"
          # 未オープン時は 409。ルートの登録と JSON 応答が生きていることの確認。
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/api/psd/texts)" = "409"
          echo "no-document -> 409 ok"

          # 上の手順で取得した PSD を使う。ローカルで走らせるときは
          # testdata/ に任意のテキストレイヤ入り PSD を置けばよい。
          PSD=$(ls testdata/*.psd 2>/dev/null | head -1 || true)
          if [ -z "$PSD" ]; then
            echo "::error::testdata/*.psd が無い (取得に失敗した?)"
            curl -sf -X POST -d '.quit' $B/_app/repl
            wait %1 || true
            exit 1
          fi
          echo "--- PSD を開く ($PSD) ---"
          printf "{\"path\":\"%s\"}" "$ROOT/$PSD" > open.json
          curl -sf -X POST -H 'Content-Type: application/json' \
            --data-binary @open.json $B/api/psd/open -o opened.json
          python3 -c "
          import json
          d = json.load(open('opened.json', encoding='utf-8'))
          assert d['open'], d
          assert len(d['texts']) >= 1, 'no text layers were found'
          print('layers=%d texts=%d' % (d['layers'], len(d['texts'])))
          print('first text:', repr(d['texts'][0]['text'][:40]))
          open('idx.txt','w').write(str(d['texts'][0]['index']))
          "

          echo "--- 本文を書き換える ---"
          IDX=$(cat idx.txt)
          printf '{"index":%s,"text":"CI smoke test \\u2705"}' "$IDX" > edit.json
          curl -sf -X POST -H 'Content-Type: application/json' \
            --data-binary @edit.json $B/api/psd/text -o edited.json
          python3 -c "
          import json
          d = json.load(open('edited.json', encoding='utf-8'))
          assert d['dirty'], d
          assert d['text'] == 'CI smoke test ✅', repr(d['text'])
          print('edit ok:', repr(d['text']))
          "

          echo "--- CSV 書き出し / 取り込み ---"
          curl -sf $B/api/psd/export -o texts.csv
          head -c 80 texts.csv | od -c | head -2
          curl -sf -X POST -H 'Content-Type: text/csv' \
            --data-binary @texts.csv "$B/api/psd/import?apply=0" -o dry.json
          python3 -c "
          import json
          d = json.load(open('dry.json', encoding='utf-8'))
          assert d['notfound'] == 0, d
          print('csv round trip ok:', {k: d[k] for k in ('changed','same','notfound','failed')})
          "

          echo "--- 別名保存して読み直す ---"
          printf '{"path":"%s/out.psd"}' "$ROOT" > save.json
          curl -sf -X POST -H 'Content-Type: application/json' \
            --data-binary @save.json $B/api/psd/save -o saved.json
          python3 -c "
          import json
          d = json.load(open('saved.json', encoding='utf-8'))
          assert d['dirty'] == 0, d
          assert any(t['text'] == 'CI smoke test ✅' for t in d['texts']), d['texts']
          print('saved and reloaded:', d['path'])
          "

          # 多言語版の下地づくりは「テキストレイヤをマスクごと複製する」形なので、
          # 複製 → 保存 → 読み直しでマスクが落ちないことを見る。マスクが落ちると
          # レイヤの見た目 (アルファ) が変わるので、元と複製を突き合わせれば分かる。
          echo "--- マスク付きテキストレイヤの複製 ---"
          printf '{"path":"%s/mask/textmask.psd"}' "$ROOT" > openmask.json
          curl -sf -X POST -H 'Content-Type: application/json' \
            --data-binary @openmask.json $B/api/psd/open -o mask.json
          SRC=$(python3 -c "
          import json
          d = json.load(open('mask.json', encoding='utf-8'))
          print(d['texts'][0]['index'])
          ")
          printf '{"index":%s,"name":"copy"}' "$SRC" > dup.json
          curl -sf -X POST -H 'Content-Type: application/json' \
            --data-binary @dup.json $B/api/psd/duplicate -o dup_out.json
          COPY=$(python3 -c "
          import json
          print(json.load(open('dup_out.json', encoding='utf-8'))['index'])
          ")
          printf '{"path":"%s/masked.psd"}' "$ROOT" > savemask.json
          curl -sf -X POST -H 'Content-Type: application/json' \
            --data-binary @savemask.json $B/api/psd/save > /dev/null
          # 保存したものを開き直して、元と複製の見た目を突き合わせる
          printf '{"path":"%s/masked.psd"}' "$ROOT" > reopen.json
          curl -sf -X POST -H 'Content-Type: application/json' \
            --data-binary @reopen.json $B/api/psd/open > /dev/null
          curl -sf "$B/api/psd/image?index=$SRC"  -o a.bin
          curl -sf "$B/api/psd/image?index=$COPY" -o b.bin
          python3 -c "
          a = open('a.bin','rb').read()
          b = open('b.bin','rb').read()
          assert len(a) == len(b) and len(a) > 0, (len(a), len(b))
          alpha = a[3::4]
          assert min(alpha) < 250 and max(alpha) > 5, 'the mask does not seem applied'
          assert a == b, 'the duplicate lost its mask (pixels differ)'
          print('mask survived duplicate+save: %d bytes identical' % len(a))
          "

          echo "--- REPL 経由で停止 ---"
          curl -sf -X POST -d '.quit' $B/_app/repl
          wait %1 || true
